<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Atividade 3 - DOM: conceitos básicos</h1>
    <hr>
    <button id="incrementar">Incrementar</button>
    <button id="decrementar">Decrementar</button>
    <p id="contador"></p>

    <hr>
    <input type="text" id="campoTexto" placeholder="Digite aqui...">
    <p>Caracteres: <span id="contadorLetras">0</span></p>
    <div id="mensagens"></div>

    <hr>
    <label for="tipoLista">Escolha o tipo de lista:</label>
    <select id="tipoLista">
        <option value="ordenada">Lista Ordenada</option>
        <option value="naoOrdenada">Lista Não Ordenada</option>
    </select>

    <button id="adicionar">Adicionar Lista</button>

    <div id="areaLista"></div>

    <hr>
    <button id="reset">Reset</button>

    <script src="script.js"></script>
</body>
</html>
